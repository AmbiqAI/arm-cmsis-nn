name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Publish a new tag or rebuild an existing tag's assets
        required: true
        default: publish
        type: choice
        options:
          - publish
          - rebuild
      tag:
        description: vMAJOR.MINOR.PATCH tag; leave empty to run Release Please
        required: false
        type: string

permissions:
  contents: read

jobs:
  bootstrap:
    if: ${{ github.event_name == 'push' || inputs.tag == '' }}
    runs-on: ubuntu-latest
    outputs:
      initial_release_published: ${{ steps.release-state.outputs.initial_release_published }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # releases/v4
        with:
          fetch-depth: 0

      - name: Validate initial immutable tag
        id: release-state
        shell: bash
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code origin refs/tags/v0.1.0 >/dev/null 2>&1; then
            echo "initial_release_published=false" >> "$GITHUB_OUTPUT"
            echo "Initial v0.1.0 is not published; Release Please remains gated."
            exit 0
          fi
          git fetch origin refs/tags/v0.1.0:refs/tags/v0.1.0
          test "$(git cat-file -t refs/tags/v0.1.0)" = tag
          release_commit="$(git rev-parse refs/tags/v0.1.0^{commit})"
          test "$(git show "${release_commit}:version.txt" | tr -d '[:space:]')" = 0.1.0
          test "$(git show "${release_commit}:.release-please-manifest.json" \
            | jq -r '."."')" = 0.1.0
          echo "initial_release_published=true" >> "$GITHUB_OUTPUT"

  release-please:
    needs: bootstrap
    if: ${{ needs.bootstrap.outputs.initial_release_published == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - name: Prepare release pull request
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

  dispatch-release-pr-ci:
    needs: release-please
    if: ${{ needs.release-please.outputs.pr != '' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_JSON: ${{ needs.release-please.outputs.pr }}
    steps:
      - name: Dispatch CI on release PR branch
        shell: bash
        run: |
          set -euo pipefail
          branch="$(printf '%s' "$PR_JSON" | jq -r '.headBranchName')"
          test -n "$branch"
          gh workflow run ci.yml --ref "$branch" --repo "$GITHUB_REPOSITORY"

  publish-release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.tag }}
      OPERATION: ${{ inputs.operation }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # releases/v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Validate immutable release candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git fetch origin main --tags

          if [ "$OPERATION" = publish ]; then
            test "$GITHUB_REF" = refs/heads/main
            test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
            if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
              echo "Tag ${RELEASE_TAG} already exists; refusing to retarget it."
              exit 1
            fi
            reviewed_pr_count="$(gh api \
              "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
              --jq '[.[] | select(.merged_at != null and .base.ref == "main" and .merge_commit_sha == env.GITHUB_SHA)] | length')"
            test "$reviewed_pr_count" -gt 0
            candidate_sha="$GITHUB_SHA"
          else
            test "$OPERATION" = rebuild
            test "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" = tag
            candidate_sha="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          fi

          git checkout --detach "$candidate_sha"
          git submodule update --init --recursive --force
          version="$(tr -d '[:space:]' < version.txt)"
          test "$version" = "${RELEASE_TAG#v}"
          test "$version" = "$(sed -n 's/^  version: "\([^"]*\)".*$/\1/p' nsx-module.yaml | head -1)"
          test "$version" = "$(jq -r '."."' .release-please-manifest.json)"
          cmake -P tests/validate_release.cmake
          echo "candidate_sha=${candidate_sha}" >> "$GITHUB_OUTPUT"

      - name: Require successful candidate CI
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            runs="$(gh run list --workflow ci.yml --event push \
              --commit "$CANDIDATE_SHA" \
              --json databaseId,status,conclusion,headSha --limit 20)"
            state="$(printf '%s' "$runs" | jq -r --arg sha "$CANDIDATE_SHA" \
              '[.[] | select(.headSha == $sha)][0] | if . == null then "" else "\(.status)|\(.conclusion)" end')"
            case "$state" in
              completed\|success) exit 0 ;;
              completed\|*)
                echo "Candidate CI failed: ${state}"
                exit 1
                ;;
              *)
                echo "Waiting for candidate CI (${attempt}/60): ${state:-not found}"
                sleep 30
                ;;
            esac
          done
          echo "Timed out waiting for candidate CI."
          exit 1

      - name: Create immutable annotated tag
        if: ${{ inputs.operation == 'publish' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" HEAD -m "Release ${RELEASE_TAG}"
          git push origin "$RELEASE_TAG"

      - name: Create source archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          archive="arm-cmsis-nn-${RELEASE_TAG#v}.tar.gz"
          tools/create-source-archive.sh HEAD "$archive"
          sha256sum "$archive" > "${archive}.sha256"
          echo "ARCHIVE=${archive}" >> "$GITHUB_ENV"

      - name: Publish release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          generate_release_notes: true
